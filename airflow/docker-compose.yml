# Airflow stack for the openfda_daily DAG, separate from the top-level
# docker-compose.yml. Based on the official Airflow 3.3.2 compose file, trimmed
# to a single machine: LocalExecutor (tasks run inside the scheduler container),
# so no Redis, Celery workers or Flower. No triggerer, since no task defers.
#
#   postgres          Airflow's metadata DB: DAG runs, task states, XCom
#   sqlserver         the warehouse the pipeline loads into
#   fda-db-init       applies ../sql/schema.sql once SQL Server is healthy
#   airflow-init      migrates the metadata DB and creates the admin login
#   airflow-apiserver UI and REST API, on host port 8081
#   airflow-scheduler decides what runs when, and runs the tasks
#   airflow-dag-processor parses the files in dags/
name: openfda-airflow

x-airflow-common: &airflow-common
  build: .
  image: openfda-airflow:3.3.2
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${FERNET_KEY:?set FERNET_KEY in airflow/.env}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?set AIRFLOW_JWT_SECRET in airflow/.env}
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    # The pipeline package, mounted read-only below, is importable from DAGs.
    PYTHONPATH: /opt/openfda
    # What the pipeline itself reads (pipeline/load.py, pipeline/ingest.py)
    DB_HOST: sqlserver
    DB_PASSWORD: ${FDA_DB_PASSWORD:?set FDA_DB_PASSWORD in airflow/.env}
    OPENFDA_API_KEY: ${OPENFDA_API_KEY:-}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
    - ../pipeline:/opt/openfda/pipeline:ro
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-common-depends-on
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${FDA_DB_PASSWORD}
    volumes:
      - fda-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -No -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  fda-db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      sqlserver:
        condition: service_healthy
    volumes:
      - ../sql:/sql:ro
    environment:
      DB_PASSWORD: ${FDA_DB_PASSWORD}
    entrypoint: ["/bin/bash", "-c", "/opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P \"$$DB_PASSWORD\" -No -i /sql/schema.sql"]

  airflow-init:
    <<: *airflow-common
    command: version
    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-larry}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?set AIRFLOW_ADMIN_PASSWORD in airflow/.env}

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "8081:8080"   # the Beelink's 8080 is already taken by the tracker app
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully
      fda-db-init:
        condition: service_completed_successfully

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-postgres:
  fda-sqlserver:
